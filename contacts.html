<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contacts - Personal Website</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #f0f4f8; }
        .contact-info { margin-bottom: 20px; }
        form {
            background: light red;
            padding: 20px;
            border-radius: 6px;
            max-width: 500px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        form label { display: block; margin-top: 10px; font-weight: bold; }
        form input[type="text"], form input[type="email"], form textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        form textarea { height: 120px; }
        .checkbox-label { font-weight: normal !important; display: inline !important; margin-left: 5px; }
        .send-btn {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .send-btn:hover { background-color: darkgreen; }
    </style>
</head>
<body>

    <!-- Top Menu -->
    <nav class="menu">
        <a href="index.html">I. Home</a>
        <a href="experience.html">II. Personal experience</a>
        <a href="contacts.html">III. Contacts</a>
        <a href="hobbies.html">IV. Hobbies</a>
    </nav>

    <!-- Moving Name Banner -->
    <div class="marquee-container">
        <span class="moving-name">Julius</span>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h2>Get in Touch</h2>
        <div class="contact-info">
            <p><strong>Phone:</strong> +254 707752398</p>
            <p><strong>Location:</strong> Kisii, Kenya</p>
            <!-- Email me link invoking mailing application -->
            <p><a href="juliusmwita@gmail.com?subject=Inquiry%20from%20Website" style="color: blue; text-decoration: underline;">Email me</a></p>
        </div>

        <hr style="border: 0; border-top: 1px solid #ccc; margin: 30px 0;">

        <!-- Contact Form matching reference specifications -->
        <form action="juliusmwita@gmail.com" method="POST" enctype="text/plain">
            <label>Enter your Name:</label>
            <input type="text" name="Name" required>

            <label>E-mail address*:</label>
            <input type="email" name="Email" required>

            <label>Message Subject:</label>
            <input type="text" name="Subject">

            <label>Enter your Message*:</label>
            <textarea name="Message" required></textarea>

            <div style="margin-top: 15px;">
                <input type="checkbox" id="copy" name="SendCopy">
                <label for="copy" class="checkbox-label">E-mail a copy of this message to your own address.</label>
            </div>

            <button type="submit" class="send-btn">Send</label>
        </form>
    </div>

    <!-- Bottom Menu -->
    <nav class="menu">

        <a href="contacts.html">III. Contacts</a>
        <a href="hobbies.html">IV. Hobbies</a>
    </nav>
